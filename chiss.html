<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master Fix</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        
        /* Menu styles */
        #menu { padding: 40px 10px; }
        .btn { 
            width: 80%; max-width: 250px; padding: 20px; margin: 10px; 
            font-size: 18px; font-weight: bold; background: #7b61ff; 
            color: white; border: none; border-radius: 12px; cursor: pointer;
        }
        
        /* Board styles */
        #game-area { display: none; padding: 10px; }
        #board { 
            display: grid; grid-template-columns: repeat(8, 11vw); grid-template-rows: repeat(8, 11vw);
            margin: auto; border: 4px solid #fff; max-width: 360px; max-height: 360px;
        }
        .sq { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 8vw; }
        @media (min-width: 400px) { 
            #board { grid-template-columns: repeat(8, 45px); grid-template-rows: repeat(8, 45px); }
            .sq { font-size: 32px; }
        }
        .light { background: #f0d9b5; }
        .dark { background: #b58863; }
        .selected { background: #7b61ff !important; }
        .white-p { color: white; filter: drop-shadow(0 0 2px black); }
        .black-p { color: black; }
        .status { color: #f1c40f; font-weight: bold; margin-bottom: 10px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="color:#7b61ff">CHESS GAME ♟️</h1>
        <button class="btn" id="pvpBtn">PLAYER vs PLAYER</button>
        <button class="btn" id="pvcBtn" style="background:#2ecc71">vs COMPUTER</button>
    </div>

    <div id="game-area">
        <div class="status" id="statusText">WHITE'S TURN</div>
        <div id="board"></div>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px; background:#e74c3c; color:white; border:none; border-radius:5px;">BACK TO MENU</button>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameArea = document.getElementById('game-area');
        const board = document.getElementById('board');
        const statusText = document.getElementById('statusText');
        
        let mode = 'pvp', selected = null, turn = 'W';
        let grid = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];
        const icons = {'r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','p':'♟','R':'♖','N':'♘','B':'♗','Q':'♕','K':'♔','P':'♙'};

        // Button Click Listeners
        document.getElementById('pvpBtn').addEventListener('click', () => start('pvp'));
        document.getElementById('pvcBtn').addEventListener('click', () => start('pvc'));

        function start(m) {
            mode = m;
            menu.style.display = 'none';
            gameArea.style.display = 'block';
            draw();
        }

        function draw() {
            board.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `sq ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    const p = grid[r][c];
                    if(p) {
                        sq.innerText = icons[p];
                        sq.className += (p === p.toUpperCase()) ? ' white-p' : ' black-p';
                    }
                    if(selected && selected.r === r && selected.c === c) sq.classList.add('selected');
                    sq.onclick = () => tap(r, c);
                    board.appendChild(sq);
                }
            }
        }

        function tap(r, c) {
            if(mode === 'pvc' && turn === 'B') return;
            const p = grid[r][c];
            const isW = p && p === p.toUpperCase();

            if(selected) {
                if(canMove(selected.r, selected.c, r, c)) {
                    grid[r][c] = grid[selected.r][selected.c];
                    grid[selected.r][selected.c] = '';
                    // Promotion
                    if(grid[r][c]==='P' && r===0) grid[r][c]='Q';
                    if(grid[r][c]==='p' && r===7) grid[r][c]='q';
                    
                    turn = (turn === 'W') ? 'B' : 'W';
                    statusText.innerText = (turn === 'W') ? "WHITE'S TURN" : "BLACK'S TURN";
                    selected = null;
                    draw();
                    if(mode === 'pvc' && turn === 'B') setTimeout(ai, 600);
                } else {
                    selected = (p && ((turn==='W'&&isW)||(turn==='B'&&!isW))) ? {r,c} : null;
                    draw();
                }
            } else if(p && ((turn==='W'&&isW)||(turn==='B'&&!isW))) {
                selected = {r,c};
                draw();
            }
        }

        function ai() {
            let moves = [];
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
                if(grid[r][c] && grid[r][c] === grid[r][c].toLowerCase()) {
                    for(let dr=0; dr<8; dr++) for(let dc=0; dc<8; dc++) {
                        if(canMove(r,c,dr,dc)) moves.push({sr:r, sc:c, dr, dc});
                    }
                }
            }
            if(moves.length > 0) {
                let m = moves[Math.floor(Math.random()*moves.length)];
                grid[m.dr][m.dc] = grid[m.sr][m.sc];
                grid[m.sr][m.sc] = '';
                turn = 'W'; statusText.innerText = "WHITE'S TURN"; draw();
            }
        }

        function canMove(sr,sc,dr,dc) {
            const p = grid[sr][sc]; const t = grid[dr][dc];
            if(t && (p===p.toUpperCase())===(t===t.toUpperCase())) return false;
            const rd = Math.abs(dr-sr), cd = Math.abs(dc-sc), ty = p.toLowerCase();
            if(ty==='p') {
                const d = p==='P'?-1:1;
                if(sc===dc && t==='') {
                    if(dr===sr+d) return true;
                    if((sr===6||sr===1) && dr===sr+2*d && grid[sr+d][sc]==='') return true;
                }
                return (rd===1 && cd===1 && t!=='');
            }
            if(ty==='r') return (sr===dr || sc===dc) && clearPath(sr,sc,dr,dc);
            if(ty==='b') return (rd===cd) && clearPath(sr,sc,dr,dc);
            if(ty==='n') return (rd===2 && cd===1) || (rd===1 && cd===2);
            if(ty==='q') return (rd===cd || sr===dr || sc===dc) && clearPath(sr,sc,dr,dc);
            if(ty==='k') return rd<=1 && cd<=1;
            return false;
        }

        function clearPath(sr,sc,dr,dc) {
            let rs = dr>sr?1:dr<sr?-1:0, cs = dc>sc?1:dc<sc?-1:0;
            let r=sr+rs, c=sc+cs;
            while(r!==dr || c!==dc) { if(grid[r][c]!=='') return false; r+=rs; c+=cs; }
            return true;
        }
    </script>
</body>
</html>
